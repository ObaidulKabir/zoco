services:
  postgres:
    image: postgres:16-alpine
    profiles: [default, minimal, test]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoqo}
      POSTGRES_DB: ${POSTGRES_DB:-zoqo}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-zoqo_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zoqo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    profiles: [default, minimal, test]
    ports:
      - "${VALKEY_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: [default, minimal, test]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zoqo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-zoqo}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"

  minio:
    image: minio/minio:latest
    profiles: [default, minimal, test]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zoqo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zoqozoqozoqo}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:latest
    profiles: [default, minimal, test]
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  traefik:
    image: traefik:v3.1
    profiles: [default, minimal]
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ../traefik:/etc/traefik/dynamic:ro

  clamav:
    image: clamav/clamav:latest
    profiles: [media]

  livekit:
    image: livekit/livekit-server:latest
    profiles: [media]
    command: --dev --bind 0.0.0.0
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"

  coturn:
    image: coturn/coturn:latest
    profiles: [media]
    ports:
      - "${TURN_PORT:-3478}:3478"
      - "${TURN_PORT:-3478}:3478/udp"

  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: [translation]
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"
    environment:
      LT_LOAD_ONLY: en,bn,hi,ar

  prometheus:
    image: prom/prometheus:latest
    profiles: [obs]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: [obs]
    ports:
      - "${GRAFANA_PORT:-3100}:3000"

  loki:
    image: grafana/loki:latest
    profiles: [obs]
    ports:
      - "${LOKI_PORT:-3101}:3100"

  glitchtip:
    image: glitchtip/glitchtip:latest
    profiles: [obs]
    ports:
      - "${GLITCHTIP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zoqo}:${POSTGRES_PASSWORD:-zoqo}@postgres:5432/${POSTGRES_DB:-zoqo}
      REDIS_URL: redis://valkey:6379
      SECRET_KEY: local-dev-only
      EMAIL_URL: consolemail://

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: [obs]
    ports:
      - "${UPTIME_KUMA_PORT:-3003}:3001"

volumes:
  postgres_data:
